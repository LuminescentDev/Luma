services:
  aptabase:
    image: ghcr.io/aptabase/aptabase:main
    restart: unless-stopped
    environment:
      - SERVICE_URL_APTABASE_8080
      - BASE_URL=${SERVICE_URL_APTABASE}
      - AUTH_SECRET=${SERVICE_PASSWORD_64_APTABASE}
      - DATABASE_URL=Server=aptabase-db;Port=5432;User Id=aptabase;Password=${SERVICE_PASSWORD_POSTGRES};Database=aptabase
      - CLICKHOUSE_URL=Host=aptabase-events-db;Port=8123;Username=aptabase;Password=${SERVICE_PASSWORD_CLICKHOUSE}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
      - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
    expose:
      - "8080"
    depends_on:
      aptabase-db:
        condition: service_healthy
      aptabase-events-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          { printf 'GET /healthz HTTP/1.0\r\n\r\n' >&0; grep -q ' 200 '; }
          0<>/dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  aptabase-db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=aptabase
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=aptabase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aptabase -d aptabase"]
      interval: 5s
      timeout: 5s
      retries: 20

  aptabase-events-db:
    image: clickhouse/clickhouse-server:23.8.4.69-alpine
    restart: unless-stopped
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_USER=aptabase
      - CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_CLICKHOUSE}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  postgres-data:
  clickhouse-data:
